name: GeDefense privileged Linux host qualification

on:
  workflow_dispatch:
    inputs:
      interface:
        description: Network interface carrying the installed GeDefense XDP program
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify-installed-host:
    runs-on: [self-hosted, linux, x64, gedefense-kernel-test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Qualify concrete kernel, NIC and installed Beta v3
        env:
          GEDEFENSE_TEST_INTERFACE: ${{ inputs.interface }}
        run: sudo bash ./scripts/validate-installed-linux-host.sh "$GEDEFENSE_TEST_INTERFACE"
