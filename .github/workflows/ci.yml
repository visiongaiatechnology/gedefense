name: GeDefense Beta v3 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_VERSION: 3.0.0-beta.1

jobs:
  go-frontend-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.2'
          cache-dependency-path: |
            control/go.mod
            gateway/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libargon2-1 libargon2-dev python3
      - name: Unit, vet, frontend and static security gates
        run: make test
      - name: Race detector
        run: make test-race
      - name: Security parser fuzz smoke
        run: make fuzz-smoke
      - name: Deterministic Go builds and version contract
        run: |
          make go gateway
          test "$(./dist/gedefense-control --version)" = "$PRODUCT_VERSION"
          test "$(./dist/gedefense-access --version)" = "${PRODUCT_VERSION}-access"

  rust-ebpf-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native and pinned Rust dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm libelf-dev zlib1g-dev
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install nightly-2026-07-16 --profile minimal --component rust-src
          cargo +1.97.1 install bpf-linker --version 0.10.3 --locked
      - name: Test and build Rust response core
        run: |
          cargo +1.97.1 test --locked --manifest-path rust/Cargo.toml -p gedefense-common -p gedefense-core
          cargo +1.97.1 build --locked --release --manifest-path rust/Cargo.toml -p gedefense-core
      - name: Build and inspect release eBPF object
        run: |
          cargo +nightly-2026-07-16 build --locked --release --manifest-path rust/Cargo.toml -p gedefense-ebpf --target bpfel-unknown-none -Z build-std=core
          llvm-objdump -h rust/target/bpfel-unknown-none/release/gedefense-ebpf
          llvm-objdump -t rust/target/bpfel-unknown-none/release/gedefense-ebpf | grep -E 'gedefense_(xdp|egress|exec)'

  distribution-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            image: ubuntu@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316
            bootstrap: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y bash python3 ca-certificates curl openssl policykit-1 desktop-file-utils
          - name: fedora
            image: fedora@sha256:7c63468daf71fdc5bda3699cd483b169bb995b5137265d5ffe8f04e2ce87fbb8
            bootstrap: dnf install -y bash python3 ca-certificates curl openssl polkit desktop-file-utils
          - name: arch
            image: archlinux/archlinux@sha256:be98153cc5dfcde238e9caf66b6abce37abeee7202624c3ca66edc883b3b508c
            bootstrap: pacman -Sy --needed --noconfirm bash python ca-certificates curl openssl polkit desktop-file-utils
          - name: opensuse
            image: opensuse/tumbleweed@sha256:d833ad1f857a057030cdc83b5ca77fdfdce9ae109e8891bf5b47e5f591725c66
            bootstrap: zypper --non-interactive refresh && zypper --non-interactive install bash python3 ca-certificates curl openssl polkit desktop-file-utils
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate ${{ matrix.name }} integration contract
        env:
          IMAGE: ${{ matrix.image }}
          BOOTSTRAP: ${{ matrix.bootstrap }}
        run: |
          docker run --rm \
            -e EXPECTED_DISTRO="${{ matrix.name }}" \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            "$IMAGE" bash -lc "$BOOTSTRAP && /src/scripts/validate-distro-integration.sh /src"

  release-artifacts:
    runs-on: ubuntu-24.04
    needs: [go-frontend-security, rust-ebpf-release, distribution-contracts]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.2'
          cache-dependency-path: |
            control/go.mod
            gateway/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y libargon2-1 libargon2-dev clang llvm libelf-dev zlib1g-dev python3
      - name: Build and cryptographically verify release artifacts
        run: ./scripts/package-artifacts.sh ./release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gedefense-beta-v2-${{ env.PRODUCT_VERSION }}
          path: |
            release/VGT_GeDefense_Beta_v3_3.0.0-beta.1_Source.zip
            release/VGT_GeDefense_Beta_v3_3.0.0-beta.1_Source.zip.sha256
            release/VGT_GeDefense_Beta_v3_3.0.0-beta.1_OneClick.run
            release/VGT_GeDefense_Beta_v3_3.0.0-beta.1_OneClick.run.sha256
          if-no-files-found: error
