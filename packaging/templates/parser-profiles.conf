# /etc/vgt/gedefense/parser-profiles.conf
#
# POINT 2 (docs/POINT2-PARSER-CELLS.md §4): pinned parser profiles for the
# ephemeral "parser-ephemeral" cells. This file is the ONLY source of parser
# binaries, argv/env allowlists and per-profile limits; the HTTP API and the
# settings namespace can only reference a profile id, never a path or argument.
#
# Contract (enforced by gedefense-cell-helper, fail-closed):
#   * file is root-owned, mode 0640, not a symlink, <= 256 KiB,
#   * at most 64 profiles, at most 32 argv entries per profile,
#   * every binary is an absolute, root-owned, non-symlink path whose SHA-256
#     matches the sha256 field,
#   * the placeholders below are the only client-influenced substitutions.
#
# The packaged default intentionally contains NO parser profile: the helper
# starts, reports "profiles=[]" and every CELL_CREATE is refused with
# ERR profile-unknown until an operator/package adds a verified profile here.
# Do not add a profile whose binary hash has not been measured on this host.
#
# [profile pdf-viewer]
# binary=/usr/bin/pdftoppm
# sha256=<64 lowercase hex sha256 of /usr/bin/pdftoppm>
# argv0=/usr/bin/pdftoppm
# argv1=-png
# argv2={input}
# argv3=/tmp/cell/out/
# env_allow=LANG,LC_ALL,TZ
# wayland=false
# pipewire=false
# max_input_bytes=8388608
# max_export_bytes=2097152
# ttl_max_seconds=300
