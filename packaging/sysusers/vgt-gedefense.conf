# STATUS: DIAMANT VGT SUPREME
g gedefense - -
g gedefense-l7 - -
# Members may read the desktop status socket (/run/gedefense/gedefense.sock, mode 0660). The
# installer adds the desktop user; without the group the socket stays root-only on purpose.
g gedefense-desktop - -
u gedefense - "VGT GeDefense control plane" /var/lib/vgt/gedefense /usr/bin/nologin
# The HTTPS gateway is internet-facing, so it gets its own account and must never join the group that
# owns the core IPC key and the storage master key. The unit runs as this user, and a root pre-step
# hands it the backend token in its own directory with mode 0600 - the gateway refuses anything else.
# Without this account the gateway unit fails to start, which is the safe direction to fail.
g gedefense-access - -
u gedefense-access - "VGT GeDefense HTTPS gateway" /var/lib/vgt/gedefense-access /usr/bin/nologin
