# STATUS: DIAMANT VGT SUPREME
# Runtime, configuration, secret and gateway directories required by the
# packaged systemd units. systemd-tmpfiles is the single provisioning authority
# for ownership/modes; packaging/scripts/gedefense-provision fills the files.
d /run/vgt-gedefense 0750 gedefense gedefense -
d /run/vgt-gedefense-l7 0750 gedefense gedefense-l7 -
d /run/gedefense 2750 gedefense gedefense-desktop -
# F-18: the user scan socket is restricted to the control-plane account; the
# directory must never be world-traversable and must sort before core start.
d /run/gedefense-scan 0750 root gedefense -
# Contract shared with the core/control units and the provisioning script.
d /etc/vgt/gedefense 0750 root gedefense -
# 0750, not 0700: the control plane runs as gedefense and must traverse this
# directory to read the 0640 root:gedefense IPC/storage keys. 0700 made every
# preflight fail with EACCES after tmpfiles enforced the packaged mode.
d /etc/vgt/gedefense/secrets 0750 root gedefense -
d /etc/vgt/gedefense/tls 0750 root gedefense -
# Ownership of the gateway directories is part of the account separation:
# - the access account owns /etc/vgt/gedefense-access (password + certificate),
# - the control plane owns /var/lib/vgt/gedefense-access and writes the token
#   there; the gateway only receives a copy through its root ExecStartPre step.
d /etc/vgt/gedefense-access 0750 gedefense-access gedefense-access -
d /var/lib/vgt/gedefense-access 0750 gedefense gedefense-access -
d /var/lib/vgt/gedefense-access/state 0700 gedefense-access gedefense-access -
d /var/lib/vgt/gedefense 1770 root gedefense -
d /var/lib/vgt/gedefense/quarantine 0700 root gedefense -
d /var/lib/vgt/gedefense/quarantine/objects 0700 root gedefense -
# Deception canaries: the privileged core creates root-owned decoys inside this
# root (fanotify-watched); the control plane can only reference them through the
# authenticated IPC deployment hook. The root is writable by the core unit.
d /var/lib/vgt/gedefense/canaries 0750 root gedefense -
# Local Gaia-Cells fallback (cgroup v2); the control plane freezes cells through
# cgroup.freeze. The dedicated subtree is the only cgroup path it may write.
d /sys/fs/cgroup/vgt-cells 0755 gedefense gedefense -
