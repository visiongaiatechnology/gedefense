[workspace]
resolver = "2"
members = ["gedefense-common", "gedefense-ebpf", "gedefense-core"]

[patch.crates-io]
aya = { path = "vendor/aya" }

[workspace.package]
version = "4.0.1"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["VisionGaia Technology"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
