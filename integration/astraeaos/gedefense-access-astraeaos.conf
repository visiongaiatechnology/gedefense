# STATUS: DIAMANT VGT SUPREME
[Unit]
Requires=gedefense-astraeaos-provision.service
After=gedefense-astraeaos-provision.service

[Service]
# Readiness helper has a 15s deadline; keep a bounded 5s service-manager margin.
TimeoutStartSec=20s
ExecStart=
ExecStart=/opt/vgt/gedefense/current/bin/gedefense-access --listen=127.0.0.1:9843 --backend=http://127.0.0.1:9844 --public-host=127.0.0.1:9843 --password-file=/etc/vgt/gedefense/access-password --session-key-file=/var/lib/vgt/gedefense/access-session.key --backend-token-file=/var/lib/vgt/gedefense/dashboard.token --tls-cert=/etc/vgt/gedefense/tls/access.crt --tls-key=%d/tls-key
ExecStartPost=/usr/lib/astraeaos/gedefense-access-ready
