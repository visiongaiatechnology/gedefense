# STATUS: DIAMANT VGT SUPREME
[Unit]
Requires=gedefense-astraeaos-provision.service
After=gedefense-astraeaos-provision.service

[Service]
# Readiness helper has a 15s deadline; keep a bounded 5s service-manager margin.
TimeoutStartSec=20s
# F-05 / CHAIN-005: AstraeaOS keeps the public listener loopback-only, but every
# runtime path below is the canonical gateway-owned layout of the base unit.
# The base unit's root ExecStartPre steps (token copy, certificate copy) and
# LoadCredential therefore remain valid and must not be cleared.
ExecStart=
ExecStart=/opt/vgt/gedefense/current/bin/gedefense-access --listen=127.0.0.1:9843 --backend=http://127.0.0.1:9844 --public-host=127.0.0.1:9843 --password-file=/etc/vgt/gedefense-access/access-password --session-key-file=/var/lib/vgt/gedefense-access/state/access-session.key --backend-token-file=/var/lib/vgt/gedefense-access/state/backend-token --tls-cert=/etc/vgt/gedefense-access/access.crt --tls-key=%d/tls-key
ExecStartPost=/usr/lib/astraeaos/gedefense-access-ready
