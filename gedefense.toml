# VGT GeDefense Full-Stack Beta 1.0 — strict TOML subset. Unknown keys are rejected.
[node]
name = "VGT-Beta-Node"
interface = "auto"
mode = "standalone"

[dashboard]
listen = "127.0.0.1:9843"
allow_remote = false
allowed_hosts = "127.0.0.1,localhost,::1"
token_file = "/var/lib/vgt/gedefense/dashboard.token"
tls_cert_file = ""
tls_key_file = ""
rate_limit_per_minute = 240
rate_limit_burst = 40
max_sse_clients = 16

[core]
socket = "/run/vgt-gedefense/core.sock"
auth_key_file = "/etc/vgt/gedefense/secrets/core-ipc.key"
request_timeout_millis = 1500

[defense]
# Comma-separated management source IPs/CIDRs. Enforce promotion is blocked while empty.
allowlist = ""
# Begin in observe. Enforce only after the Rust core and XDP program pass tests on the target kernel/NIC.
enforcement = "observe"
default_ttl_seconds = 3600
max_ttl_seconds = 604800
max_block_entries = 250000
strict_asn_drop = false
dpi_enabled = true

[l7]
# Local application-layer inspection over a bounded Unix-socket protocol.
enabled = true
# observe = record findings only; block = deny only after the global release gate reaches Enforce.
mode = "observe"
socket = "/run/vgt-gedefense-l7/inspect.sock"
socket_group = "gedefense-l7"
request_timeout_millis = 750
max_concurrent = 16
max_envelope_bytes = 3145728
max_body_bytes = 2097152
max_uri_bytes = 16384
max_header_bytes = 65536
max_headers = 128
max_value_bytes = 16384
max_inspection_bytes = 4194304
max_decoded_values = 4096
max_decode_depth = 4
max_json_depth = 32
max_form_fields = 512
max_multipart_parts = 64
max_upload_bytes = 2097152
alert_score = 40
block_score = 90
client_rate_per_minute = 600
client_rate_burst = 100
sensitive_rate_per_minute = 30
sensitive_rate_burst = 10
# Shared per-route budget catches distributed pressure that stays below each client budget.
sensitive_global_rate_per_minute = 300
sensitive_global_rate_burst = 50
max_tracked_clients = 65536
sensitive_paths = "/wp-login.php,/xmlrpc.php,/login,/signin,/api/login"
# The Unix socket is mode 0660. Enable SO_PEERCRED enforcement when deployment UIDs/GIDs are stable.
require_peer_credentials = false
allowed_peer_uids = ""
allowed_peer_gids = ""

# Optional native inline path. No webserver plugin or external runtime is required.
# Prefer a local application Unix socket; explicit loopback HTTP is also supported.
inline_enabled = false
inline_socket = "/run/vgt-gedefense-l7/edge.sock"
inline_upstream = "http://127.0.0.1:8080"
inline_max_response_bytes = 65536

[policy]
state_file = "/var/lib/vgt/gedefense/policy.json"
signing_key_file = "/var/lib/vgt/gedefense/policy.ed25519"
public_key_file = "/var/lib/vgt/gedefense/policy.ed25519.pub"
storage_key_file = "/etc/vgt/gedefense/secrets/storage-master.key"
require_signed = true

[xdr]
enabled = true
# observe = log only; contain = brokered SIGSTOP; enforce = broker-reviewed SIGKILL for objective evidence.
mode = "observe"
scan_interval_millis = 750
network_interval_seconds = 3
integrity_interval_seconds = 3
alert_score = 40
contain_score = 80
kill_score = 120
max_command_bytes = 8192
command_preview_bytes = 320
dedupe_seconds = 300
max_incident_log_bytes = 67108864
incident_log = "/var/lib/vgt/gedefense/incidents.jsonl"
log_key_file = "/var/lib/vgt/gedefense/xdr-log.key"
baseline_file = "/etc/vgt/gedefense/xdr-baseline.json"
protected_paths = "/opt/vgt/gedefense/current/bin/gedefense-control,/opt/vgt/gedefense/current/bin/gedefense-access,/opt/vgt/gedefense/current/libexec/gedefense-core,/opt/vgt/gedefense/current/lib/gedefense/gedefense-ebpf,/etc/vgt/gedefense/gedefense.toml,/etc/vgt/gedefense/xdr-baseline.json"
allow_processes = ""
worker_count = 4
queue_capacity = 2048
max_evaluations_per_scan = 4096
behavior_enabled = true
behavior_warmup_samples = 24
behavior_zscore_milli = 3500
behavior_min_connections = 8
behavior_max_profiles = 4096
behavior_max_ports_per_profile = 256
behavior_profile_file = "/var/lib/vgt/gedefense/behavior-profiles.json"
storage_key_file = "/etc/vgt/gedefense/secrets/storage-master.key"

[runtime]
settings_file = "/var/lib/vgt/gedefense/runtime-settings.json"
key_file = "/var/lib/vgt/gedefense/runtime-settings.key"
storage_key_file = "/etc/vgt/gedefense/secrets/storage-master.key"

[cells]
enabled = false
socket = "/run/gaia-cells/control.sock"
auth_key_file = "/etc/vgt/gedefense/secrets/gaia-cells.key"
request_timeout_millis = 1500

[release]
channel = "beta"
minimum_observe_seconds = 300
minimum_canary_seconds = 900
core_failure_threshold = 3
max_evaluation_drop_permille = 5
emergency_stop_file = "/var/lib/vgt/gedefense/EMERGENCY_STOP"
auto_degrade = true

[feeds]
enabled = true
auto_apply = false
refresh_minutes = 60
max_download_bytes = 8388608
max_entries = 100000
sources = "https://feodotracker.abuse.ch/downloads/ipblocklist.txt,https://www.spamhaus.org/drop/drop.txt"
