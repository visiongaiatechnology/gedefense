<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="GeDefense Linux 6.3.0 Anti-Spyware and Anti-Rootkit 10 Defense Planes AP-0 through AP-9">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="50%" stop-color="#0b192c"/>
      <stop offset="100%" stop-color="#060f1a"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10253f"/>
      <stop offset="100%" stop-color="#0a182b"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" rx="18" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="1168" height="668" rx="14" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="40" y="34" width="180" height="28" rx="14" fill="#0e2a47" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="130" y="53" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">RELEASE 6.3.0 · 12/12 PLANES</text>
  <text x="40" y="96" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" font-weight="800">GeDefense Linux 6.3.0 — Advanced Anti-Spyware &amp; Anti-Rootkit Fabric (AP-0 – AP-9)</text>
  <text x="40" y="122" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">Ten coordinated kernel-near, static-musl, and control-plane layers defending against commercial implants, rootkits, credential theft, io_uring bypasses, and silent exfiltration</text>

  <!-- Pillar 1: AP-0 - AP-2 -->
  <rect x="40" y="148" width="545" height="240" rx="12" fill="url(#cardGrad1)" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="40" y="148" width="545" height="6" rx="3" fill="url(#accentCyan)"/>
  <text x="62" y="182" fill="#38bdf8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800">AP-0 – AP-2 · Core Immunity, Inode Trust &amp; BPF Guard</text>

  <rect x="62" y="198" width="501" height="52" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="76" y="219" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-0 · Static-PIE musl Core &amp; SelfGuard</text>
  <text x="76" y="238" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Zero glibc/NEEDED immune to LD_PRELOAD · 23 critical BPF pin checks (&lt;=5s) · Canary self-test</text>

  <rect x="62" y="258" width="501" height="52" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="76" y="279" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-1 · BTF exec_inode Trust &amp; CredentialGuard</text>
  <text x="76" y="298" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Verifies task_struct-&gt;mm-&gt;exe_file-&gt;f_inode (immune to comm spoofing) · -EACCES on secret reads</text>

  <rect x="62" y="318" width="501" height="52" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="76" y="339" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-2 · Attach-Time BPF_GUARD (eBPF Rootkit Watch)</text>
  <text x="76" y="358" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">lsm/bpf_prog + sys_enter_bpf + helper-risk bitmap (write_user, override_return, send_signal)</text>

  <!-- Pillar 2: AP-3 - AP-4 -->
  <rect x="615" y="148" width="545" height="240" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="148" width="545" height="6" rx="3" fill="url(#accentEmerald)"/>
  <text x="637" y="182" fill="#34d399" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800">AP-3 – AP-4 · CrossView Unmasking &amp; KernelHooks</text>

  <rect x="637" y="198" width="501" height="82" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="651" y="220" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-3 · 8-Domain CrossView Rootkit Verifier</text>
  <text x="651" y="240" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Detects discrepancies between kernel iterators and /proc/userland views:</text>
  <text x="651" y="259" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Hidden tasks · Hidden BPF progs/maps · Hidden sockets (NETLINK) · Portless raw taps · LKM/ftrace/pins · Lib-DB</text>

  <rect x="637" y="290" width="501" height="80" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="651" y="312" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-4 · KernelHooks: io_uring Bypass &amp; Pre-Stealth LKM Audit</text>
  <text x="651" y="332" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">io_uring LSM hooks (override_creds, sqpoll, cmd) + create/register/submit tracepoints</text>
  <text x="651" y="351" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Captures init/finit/delete_module before rootkit stealth · Opt-in io_uring_disabled &amp; memfd_noexec=2</text>

  <!-- Pillar 3: AP-5 - AP-6 -->
  <rect x="40" y="408" width="545" height="246" rx="12" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="40" y="408" width="545" height="6" rx="3" fill="url(#accentGold)"/>
  <text x="62" y="442" fill="#fbbf24" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800">AP-5 – AP-6 · Persistence, Peripheral, StyX PCR &amp; DNS</text>

  <rect x="62" y="458" width="501" height="82" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="76" y="480" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-5 · PersistenceGuard, Memory &amp; Peripheral Spyware</text>
  <text x="76" y="500" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Guards ld.so.preload, linker, PAM/sshd libs (Ebury/xz), systemd/udev RUN+=, ptrace/process_vm</text>
  <text x="76" y="519" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Monitors camera (/dev/video*), mic (/dev/snd/*), evdev keyloggers &amp; browser/SSH/GPG secret stores</text>

  <rect x="62" y="550" width="501" height="84" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="76" y="572" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-6 · StyX Phase-2 (PCR), 5-Signal DNS &amp; GIEF/SBC Fusion</text>
  <text x="76" y="592" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Real cgroup_skb/ingress RX observer + 5-min Producer-Consumer-Ratio (PCR &gt; 0.60, &gt;=256 KiB)</text>
  <text x="76" y="611" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">UDP/53 DNS tunnel detector (&gt;=3/5 signals) · gief/v1.0 envelopes + time-weighted SBC graph fusion</text>

  <!-- Pillar 4: AP-7 - AP-9 -->
  <rect x="615" y="408" width="545" height="246" rx="12" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="615" y="408" width="545" height="6" rx="3" fill="url(#accentViolet)"/>
  <text x="637" y="442" fill="#a78bfa" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800">AP-7 – AP-9 · Containment, Chameleon &amp; Resilience</text>

  <rect x="637" y="458" width="501" height="54" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="651" y="479" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-7 · Titan Exec Gate, Fanotify, RansomSensor, PermitV1 &amp; Cells</text>
  <text x="651" y="498" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">BPF-LSM bprm/mmap/WX blocks · PID-tree isolation · Signed PermitV1 broker · One-shot parser cells</text>

  <rect x="637" y="519" width="501" height="52" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="651" y="540" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-8 · Chameleon Identity Profile &amp; Deception Canaries</text>
  <text x="651" y="559" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Trap decoy keys/files + opt-in same-length ELF .strtab neutralization (174 kernel symbols renamed)</text>

  <rect x="637" y="578" width="501" height="56" rx="8" fill="#081423" stroke="#1e3a5f"/>
  <text x="651" y="599" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">AP-9 · ARES Evidence &amp; Sensor Self-Defense (S08/S09/S12/R6)</text>
  <text x="651" y="618" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">256 KiB SEC_CRIT_EVENTS ring + flood buckets · 2-of-3 Ed25519 TUF feeds · Gateway RBAC · Witness push</text>

  <!-- Footer -->
  <text x="40" y="674" fill="#64748b" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">VisionGaiaTechnology (VGT) · GeDefense Linux 6.3.0 · Verified 100.0% Det TPR / 75.0% Prev TPR / 0.0% Det+Prot FPR across RedHard 1.3 (S16–S20)</text>
</svg>
